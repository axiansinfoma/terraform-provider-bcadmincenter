# Pre-commit hooks for documentation validation
# Install with: pre-commit install
# Run manually with: pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: ^docs/
      - id: end-of-file-fixer
        exclude: ^docs/
      - id: check-yaml
        args: ['--unsafe']  # Allow custom tags in GitHub Actions
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: ['--fix=lf']

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.86.0
    hooks:
      - id: terraform_fmt
        files: ^examples/

  - repo: local
    hooks:
      - id: check-copyright-headers
        name: Check copyright headers in examples
        entry: bash -c 'for file in $(git diff --cached --name-only --diff-filter=ACM | grep "^examples/.*\.tf$"); do if ! grep -q "Copyright (c)" "$file"; then echo "Missing copyright header in $file"; exit 1; fi; done'
        language: system
        pass_filenames: false
        files: ^examples/.*\.tf$

      - id: validate-documentation-templates
        name: Validate documentation templates
        entry: bash -c 'for template in $(git diff --cached --name-only --diff-filter=ACM | grep "^templates/.*\.tmpl$"); do if ! grep -q "{{ .SchemaMarkdown }}" "$template"; then echo "Missing {{ .SchemaMarkdown }} in $template"; exit 1; fi; done'
        language: system
        pass_filenames: false
        files: ^templates/.*\.tmpl$

      # Regenerates docs/ and FAILS if the result differs from what is committed.
      # Deliberately does not `git add docs/`: silently amending staged content hides
      # generated changes from the review the developer is about to commit.
      - id: check-documentation-sync
        name: Check documentation is in sync
        entry: bash -c 'cd tools && go generate && cd .. && git diff --exit-code docs/ || { echo; echo "Documentation is out of sync — docs/ was regenerated in your working tree."; echo "Review the changes and stage them, then commit again."; exit 1; }'
        language: system
        pass_filenames: false
        files: ^(templates/|internal/|examples/)
